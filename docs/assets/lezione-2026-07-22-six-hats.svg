<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Metodo dei 6 cappelli applicato alla sessione del 22 luglio 2026</title>
  <desc id="desc">Mappa dei sei cappelli: blu, bianco, rosso, nero, giallo e verde.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Lezione 22 luglio 2026 - Lettura a 6 cappelli</text>
  <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4b5563">La giornata e' stata trasformata in processo: fatti, rischi, valore, emozioni, alternative e regia.</text>

  <g transform="translate(70,145)">
    <rect width="320" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="24" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Blu - Regia</text>
    <text x="24" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Obiettivi e sequenza della giornata</text>
    <text x="24" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Gate MoA e regole operative</text>
    <text x="24" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Chiusura con runbook verificabile</text>
  </g>

  <g transform="translate(440,145)">
    <rect width="320" height="170" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="24" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Bianco - Fatti</text>
    <text x="24" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Redis attivo e PONG</text>
    <text x="24" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Adapter ready, test OK</text>
    <text x="24" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Run #6 e #7 gate ready</text>
  </g>

  <g transform="translate(810,145)">
    <rect width="320" height="170" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="24" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">Rosso - Percezioni</text>
    <text x="24" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Frizione quando il sistema non concertava</text>
    <text x="24" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Fiducia ricostruita con prove</text>
    <text x="24" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Richiesta di rigore, non teatro</text>
  </g>

  <g transform="translate(70,390)">
    <rect width="320" height="190" rx="10" fill="#111827" stroke="#030712" stroke-width="2"/>
    <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f9fafb">Nero - Rischi</text>
    <text x="24" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">Falsa concertazione</text>
    <text x="24" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">Output Gemini troncati</text>
    <text x="24" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">Gate tecnico diverso da qualita'</text>
    <text x="24" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e5e7eb">Drift tra SVG e Mermaid</text>
  </g>

  <g transform="translate(440,390)">
    <rect width="320" height="190" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">Giallo - Valore</text>
    <text x="24" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Bus persistente su Redis</text>
    <text x="24" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Adapter provider reali</text>
    <text x="24" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">E2E e canary dimostrabili</text>
    <text x="24" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Dispensa riusabile</text>
  </g>

  <g transform="translate(810,390)">
    <rect width="320" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Verde - Hardening</text>
    <text x="24" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Retry e controllo token</text>
    <text x="24" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Sanificazione UTF-8/Unicode</text>
    <text x="24" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">SVG statico piu' Mermaid sorgente</text>
    <text x="24" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2937">Audit dei contributi salvati</text>
  </g>

  <rect x="246" y="652" width="708" height="54" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="600" y="686" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e3a8a">Principio guida: mostrare prove, limiti e processo, non solo una risposta finale.</text>
</svg>
